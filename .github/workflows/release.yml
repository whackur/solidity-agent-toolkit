name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish-solidity-agent-toolkit
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - name: Install npm pack and trusted publish CLI
        run: npm install --global npm@11

      - name: Verify release tag and event commit
        run: node scripts/release/verify-tag.mjs

      - run: pnpm install --frozen-lockfile

      - name: Verify quality before publish
        run: pnpm test && pnpm typecheck && pnpm lint

      - run: pnpm run build

      - name: Prepare the single release archive
        id: pack
        run: node scripts/release/prepare-package.mjs "$RUNNER_TEMP/release-package"

      - name: Smoke-test the exact archive as an installed consumer
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.archive }}
        run: node scripts/release/smoke-package.mjs "$RELEASE_TARBALL"

      - name: Name this attempt's immutable release artifact
        id: artifact
        run: echo "name=release-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install npm for trusted publishing
        run: npm install --global npm@11

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-package

      - name: Publish the tested archive and confirm registry integrity
        run: node scripts/release/publish-package.mjs "$RUNNER_TEMP/release-package"

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-package

      - name: Create or recover the GitHub Release and tested asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/create-github-release.mjs "$RUNNER_TEMP/release-package"
