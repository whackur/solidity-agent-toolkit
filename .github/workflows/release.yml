name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true # data/owasp-scs submodule required for build/test

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm for trusted publishing
        run: npm install --global npm@11

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            const expected = `v${version}`;
            if (process.env.TAG_NAME !== expected) {
              throw new Error(`Expected release tag ${expected}, got ${process.env.TAG_NAME}`);
            }
          '

      - run: pnpm install --frozen-lockfile

      - name: Verify quality before publish
        run: pnpm test && pnpm typecheck && pnpm lint

      - run: pnpm run build

      - name: Publish to npm
        run: npm publish --provenance

      - name: Create GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
